name: Nightly Live Tests

# Runs the @pytest.mark.live suite against the real upstream APIs once per day
# to catch schema drift and silent breaking changes. Upstream failures do NOT
# fail this workflow — instead a GitHub issue is opened (or updated) so a
# maintainer can investigate. The job itself stays green by design.
#
# Audit reference: OPS-001 (test strategy).

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run live tests
        id: livetests
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=src pytest tests/ -m live \
            --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `outcome == 'failure'` kennt rot und nicht rot. Ein Live-Lauf hat drei
      # Antworten, und die dritte zaehlt: Ein gescheitertes `pip install`, ein
      # Timeout oder eine umbenannte Marke sind NICHT dasselbe wie ein
      # Schemawechsel bei SIK-ISEA, opendata.swiss oder der Nationalbibliothek.
      # Das Issue darunter zaehlt genau diese Ursachen auf und behauptete damit
      # bei jedem roten Lauf eine davon — auch dann, wenn die Suite gar nicht
      # erst gelaufen war.
      #
      # Und die andere Richtung: Ueberspringt die Suite jeden Test, endet pytest
      # mit 0, `outcome` ist `success`, und der Lauf sah aus wie eine bestandene
      # Pruefung gegen drei Quellen, von denen keine gefragt wurde.
      - name: Ergebnis einordnen
        id: verdict
        env:
          PYTEST_EXIT: ${{ steps.livetests.outputs.pytest_exit }}
        run: |
          args=(live-report.xml)
          if [ -n "$PYTEST_EXIT" ]; then
            args+=(--pytest-exit "$PYTEST_EXIT")
          fi
          python scripts/classify_live_run.py "${args[@]}"

      - name: Report upstream failure
        if: steps.verdict.outputs.state == 'finding'
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'nightly-live-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Die nächtlichen Live-Tests gegen die Upstream-APIs sind fehlgeschlagen.',
              '',
              `- Workflow-Lauf: ${runUrl}`,
              `- Zeitpunkt: ${new Date().toISOString()}`,
              '',
              'Mögliche Ursachen: Schema-Änderung, geänderter Endpoint, Rate-Limit',
              'oder temporäre Nichterreichbarkeit einer Quelle (SIK-ISEA,',
              'opendata.swiss, Nationalbibliothek).',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.notice(`Updated existing issue #${existing.data[0].number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Nightly live tests failing against upstream APIs',
                body,
                labels: [label],
              });
              core.notice(`Opened issue #${created.data.number}.`);
            }

      # Erst hier wird der Job rot — bisher wurde er es nie. `continue-on-error`
      # oben schluckte jeden Fehlschlag, und das einzige Signal war das Issue.
      # Fuer `finding` reichte das; fuer `unknown` nicht, denn ein Lauf, der
      # nichts gemessen hat, erzeugt bewusst kein Issue und waere sonst voellig
      # stumm geblieben — ein gruener Haken ohne Messung dahinter.
      #
      # Ueber `env`, nicht ueber `${{ }}` im Skript: Der Grund kann eine
      # Parser-Meldung ueber eine fremde Datei enthalten, und `${{ }}` setzt sie
      # vor dem Start woertlich in die Shell ein.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live-Suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
