name: Nightly Live Tests

# Runs the @pytest.mark.live suite against the real upstream APIs once per day
# to catch schema drift and silent breaking changes. Upstream failures do NOT
# fail this workflow — instead a GitHub issue is opened (or updated) so a
# maintainer can investigate. The job itself stays green by design.
#
# Audit reference: OPS-001 (test strategy).

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run live tests
        id: livetests
        continue-on-error: true
        run: PYTHONPATH=src pytest tests/ -m live

      - name: Report upstream failure
        if: steps.livetests.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'nightly-live-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Die nächtlichen Live-Tests gegen die Upstream-APIs sind fehlgeschlagen.',
              '',
              `- Workflow-Lauf: ${runUrl}`,
              `- Zeitpunkt: ${new Date().toISOString()}`,
              '',
              'Mögliche Ursachen: Schema-Änderung, geänderter Endpoint, Rate-Limit',
              'oder temporäre Nichterreichbarkeit einer Quelle (SIK-ISEA,',
              'opendata.swiss, Nationalbibliothek).',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.notice(`Updated existing issue #${existing.data[0].number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Nightly live tests failing against upstream APIs',
                body,
                labels: [label],
              });
              core.notice(`Opened issue #${created.data.number}.`);
            }
